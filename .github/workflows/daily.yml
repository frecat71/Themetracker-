name: Daily Theme Tracker Update

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch industry data
        run: python scripts/fetch_industries.py

      - name: Fetch ETF data
        run: python scripts/fetch_etfs.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json etf_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
