name: EU ETFs CSV Update

on:
  push:
    paths:
      - 'data/eu_etfs/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process EU ETF CSV
        run: python scripts/process_eu_etfs.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_etf_data.json eu_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: EU ETF update from CSV"
            git push
          fi
